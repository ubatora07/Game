<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#040711" />
    <title>Anime Infinite Ascension</title>
    <!-- Yandex Games SDK v2 -->
    <script src="https://yandex.ru/games/sdk/v2"></script>
    <link rel="stylesheet" href="./src/ui/design/tokens.css" />
    <link rel="stylesheet" href="./src/ui/design/animations.css" />
    <link rel="stylesheet" href="./src/ui/design/layout.css" />
  </head>
  <body>
    <div id="app">
      <!-- Loading Screen Splash -->
      <div id="appLoadingSplash" style="position:absolute; top:0; left:0; width:100%; height:100%; background:#040711; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; color:#f8fafc; font-family:sans-serif;">
        <div style="font-size:64px; animation:heroFloat 2s ease-in-out infinite; margin-bottom:12px;">🥋</div>
        <h1 style="font-family:'Impact', 'Trebuchet MS', sans-serif; font-size:26px; color:#fde047; letter-spacing:2px; margin-bottom:4px; text-align:center;">
          ANIME INFINITE ASCENSION
        </h1>
        <p style="color:#94a3b8; font-size:13px; margin-bottom:24px;">Loading cultivation realm...</p>
        <div style="width:200px; height:6px; background:#1e293b; border-radius:9999px; overflow:hidden;">
          <div id="splashProgressBar" style="width:100%; height:100%; background:linear-gradient(90deg, #f59e0b, #fde047); border-radius:9999px; animation:auraPulse 1.2s infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
